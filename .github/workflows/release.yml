name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release tag to publish
        required: true
        type: string
      sha:
        description: Exact public repository commit to publish
        required: true
        type: string

concurrency:
  group: agent-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/nouvalabs/nouva-agent
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release configuration
        env:
          NOUVA_CONTROL_PLANE_URL: ${{ secrets.NOUVA_CONTROL_PLANE_URL }}
          NOUVA_AGENT_RELEASE_WEBHOOK_SECRET: ${{ secrets.NOUVA_AGENT_RELEASE_WEBHOOK_SECRET }}
        run: |
          missing=""

          if [ -z "${NOUVA_CONTROL_PLANE_URL}" ]; then
            missing="NOUVA_CONTROL_PLANE_URL"
          fi

          if [ -z "${NOUVA_AGENT_RELEASE_WEBHOOK_SECRET}" ]; then
            if [ -n "${missing}" ]; then
              missing="${missing}, "
            fi
            missing="${missing}NOUVA_AGENT_RELEASE_WEBHOOK_SECRET"
          fi

          if [ -n "${missing}" ]; then
            echo "Missing required release secret(s): ${missing}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag matches agent package version
        run: |
          node <<'EOF'
          const pkg = require("./agent/package.json");
          const actualTag = process.env.RELEASE_TAG;
          const expectedTag = `v${pkg.version}`;

          if (actualTag !== expectedTag) {
            console.error(
              `Release tag ${actualTag} does not match agent/package.json version ${pkg.version}. Expected ${expectedTag}.`
            );
            process.exit(1);
          }
          EOF

      - name: Validate dispatched release state
        if: github.event_name == 'workflow_dispatch'
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi

          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" = "true" ]; then
            target="$(gh release view "${RELEASE_TAG}" --json targetCommitish --jq '.targetCommitish')"
            if [ "${target}" != "${RELEASE_SHA}" ]; then
              echo "Draft ${RELEASE_TAG} targets ${target}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            released_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${released_sha}" != "${RELEASE_SHA}" ]; then
              echo "${RELEASE_TAG} points to ${released_sha}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi

          echo "is_draft=${is_draft}" >> "${GITHUB_OUTPUT}"

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ env.RELEASE_SHA }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/nouvalabs/nouva-agent
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.docker.outputs.digest }}"

      # Customer servers pull without credentials, and the control plane starts rolling a release out
      # as soon as it is notified. GHCR creates a new package private, so stop here, before the control
      # plane is notified (and, for a dispatched draft, before it is published), until the package has
      # been made public; then re-run this job.
      - name: Check the image is publicly pullable
        env:
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
        run: |
          repository="${IMAGE_NAME#ghcr.io/}"
          # A private package is refused an anonymous token, so an empty token is expected there;
          # the manifest request below is what decides.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r '.token // empty' || true)"
          if [ -z "${token}" ]; then
            echo "::warning::GHCR issued no anonymous pull token for ${repository}: the package is private, or GHCR is unreachable."
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${repository}/manifests/${IMAGE_DIGEST}")"
          if [ "${status}" != "200" ]; then
            echo "::error::${IMAGE_NAME}@${IMAGE_DIGEST} is not anonymously pullable (HTTP ${status}). If the package is private, make it public; if GHCR was unavailable, retry. Then re-run this job."
            exit 1
          fi

      - name: Publish automated GitHub release
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.release-state.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false

      - name: Resolve published release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          echo "id=$(gh api "${endpoint}" --jq '.id')" >> "${GITHUB_OUTPUT}"
          echo "url=$(gh api "${endpoint}" --jq '.html_url')" >> "${GITHUB_OUTPUT}"
          echo "published_at=$(gh api "${endpoint}" --jq '.published_at')" >> "${GITHUB_OUTPUT}"

      - name: Notify control plane
        env:
          NOUVA_CONTROL_PLANE_URL: ${{ secrets.NOUVA_CONTROL_PLANE_URL }}
          NOUVA_AGENT_RELEASE_WEBHOOK_SECRET: ${{ secrets.NOUVA_AGENT_RELEASE_WEBHOOK_SECRET }}
          VERSION: ${{ env.RELEASE_TAG }}
          DIGEST: ${{ steps.docker.outputs.digest }}
          GIT_SHA: ${{ env.RELEASE_SHA }}
          GITHUB_RELEASE_ID: ${{ steps.release.outputs.id }}
          GITHUB_RELEASE_URL: ${{ steps.release.outputs.url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          node <<'EOF'
          const crypto = require("node:crypto");

          (async () => {
            const baseUrl = process.env.NOUVA_CONTROL_PLANE_URL;
            const secret = process.env.NOUVA_AGENT_RELEASE_WEBHOOK_SECRET;
            const imageName = process.env.IMAGE_NAME;
            const digest = process.env.DIGEST;

            if (!baseUrl) {
              throw new Error("NOUVA_CONTROL_PLANE_URL is required");
            }

            if (!secret) {
              throw new Error("NOUVA_AGENT_RELEASE_WEBHOOK_SECRET is required");
            }

            if (!digest) {
              throw new Error("DIGEST is required");
            }

            const payload = {
              version: process.env.VERSION,
              imageRef: `${imageName}@${digest}`,
              digest,
              gitSha: process.env.GIT_SHA,
              githubReleaseId: process.env.GITHUB_RELEASE_ID,
              githubReleaseUrl: process.env.GITHUB_RELEASE_URL,
              publishedAt: process.env.PUBLISHED_AT,
            };

            const body = JSON.stringify(payload);
            const signature = `sha256=${crypto.createHmac("sha256", secret).update(body).digest("hex")}`;
            const endpoint = `${baseUrl.replace(/\/$/, "")}/api/internal/agent-releases/published`;

            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-nouva-signature-256": signature,
              },
              body,
            });

            if (!response.ok) {
              throw new Error(
                `Control plane release ingestion failed (${response.status}): ${await response.text()}`
              );
            }

            console.log(await response.text());
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Show image digest
        run: echo "Published ${IMAGE_NAME}@${{ steps.docker.outputs.digest }}"
